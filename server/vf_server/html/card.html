<style>
body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#ece1c8;background:radial-gradient(120% 70% at 50% 0,#2b2118,#18120d 60%,#0e0b08)}
#r{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #7d6130,inset 0 0 0 4px #0b0907,inset 0 0 0 5px rgba(220,181,99,.28)}
#r::before{content:"";position:absolute;inset:3px;pointer-events:none;background:radial-gradient(circle,#dcb563 0 2.4px,transparent 3px) 0 0/9px 9px no-repeat,radial-gradient(circle,#dcb563 0 2.4px,transparent 3px) 100% 0/9px 9px no-repeat,radial-gradient(circle,#dcb563 0 2.4px,transparent 3px) 0 100%/9px 9px no-repeat,radial-gradient(circle,#dcb563 0 2.4px,transparent 3px) 100% 100%/9px 9px no-repeat}
.h{display:flex;align-items:center;gap:8px;font:700 18px/1.2 serif;font-variant:small-caps;letter-spacing:.06em;color:#dcb563}
.h i{flex:1;height:1px;background:linear-gradient(90deg,#7d6130,transparent)}
.pl{padding:2px 9px;border:1px solid;border-radius:10px;font:700 12px/1.3 system-ui,sans-serif;font-variant:normal;letter-spacing:0;background:rgba(0,0,0,.35)}
.ln{padding:9px 11px;font-weight:500;background:#0a0806;border:1px solid #4a3a20;border-radius:3px;box-shadow:inset 0 2px 5px rgba(0,0,0,.85)}
.hn{font-size:13px;line-height:1.35;color:#a89a7e}
.lb{font-weight:700;font-size:13px;color:#b5a688}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
button{min-height:44px;border-radius:4px;font:700 14px system-ui,sans-serif;cursor:pointer}
.c{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;color:#b5a688;background:linear-gradient(#30261c,#19130e);border:1px solid #4a3a20}
.c.on{color:#ece1c8;border-color:#dcb563;background:linear-gradient(rgba(220,181,99,.22),rgba(220,181,99,.06))}
.c:active,.b:active{filter:brightness(1.3)}
.d{width:8px;height:8px;flex:none;border-radius:50%}
.r{display:flex;gap:8px}
.b{flex:1;padding:0 12px;font-size:15px;color:#ffd77a;border:1px solid #1d0603;background:linear-gradient(#b9331f,#82180d 55%,#5f0f08);box-shadow:0 0 0 1px #7d6130,inset 0 1px 0 rgba(255,190,130,.45)}
.b.gh{color:#ece1c8;border-color:#000;background:linear-gradient(#30261c,#19130e)}
.b[disabled]{filter:saturate(.25) brightness(.7)}
.a{min-height:0;padding:0;border:0;background:none;font:500 13px system-ui,sans-serif;color:#e8c46e;text-decoration:underline}
.n{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid;border-radius:3px;font-size:14px;background:rgba(0,0,0,.35)}
.sa{padding-right:var(--tg-content-safe-area-corner-right,56px)}
</style>
<div id="r"></div>
<script>
var W=window.TelegramWidget,R=document.querySelector('#r'),L=/*L*/{},d={},sel='say',to='',more=0,err='',
C={say:'#f3eee6',group:'#aab4ff',guild:'#56e06a',raid:'#ff9c5a',whisper:'#ff8ef0',reply:'#ff8ef0',yell:'#ff5c5c',instance:'#ff9c5a',officer:'#40c860',emote:'#ff9c5a',party:'#aab4ff',raid_warning:'#ff9c5a',channel:'#ffc8b0'},
P={ask:'#f2ad42',busy:'#f2ad42',sent:'#5ed474',fail:'#ff7563',cancel:'#a59a88'};
function T(k,v){return String(L[k]||k).replace(/\{(\w+)\}/g,function(m,n){return v&&n in v?v[n]:m})}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function hm(t){var x=new Date(t*1e3);return('0'+x.getHours()).slice(-2)+':'+('0'+x.getMinutes()).slice(-2)}
function load(){d=JSON.parse(W.chatData||'{}');sel=d.c||'say';to=d.t||'';err='';draw()}
function chip(k){return'<button class="c'+(sel==k?' on':'')+'" onclick="pick(\''+k+'\')"><span class="d" style="background:'+C[k]+'"></span>'+T(k=='reply'?k:'chan.'+k)+'</button>'}
function pick(k){sel=k;to=k==d.c?d.t||'':'';draw()}
function nick(i){to=d.n[i];draw()}
function label(){return sel=='whisper'?T('chan.whisper_to',{name:to||'?'}):sel=='channel'?T('chan.numbered',{n:to}):T('chan.'+sel)}
function fit(){[].forEach.call(R.querySelectorAll('.c'),function(b){for(var f=14;b.scrollWidth>b.clientWidth&&f>11;)b.style.fontSize=--f+'px';var d=b.querySelector('.d');if(d&&b.scrollWidth>b.clientWidth)d.style.display='none'})}
function draw(){
var s=d.s||'ask',h='<div class="h"><svg width="20" height="20" viewBox="0 0 32 32"><path d="M16 0L10.2 2.5L2.7 4.9L2.8 15.2L3.3 17.5L4.4 20.2L6.2 23.1L8.4 25.7L11.3 28.4L16 32L20.7 28.4L23.6 25.7L25.8 23.1L27.6 20.2L28.7 17.5L29.2 15.2L29.3 4.9L21.8 2.5Z" fill="#eeb841"/><path d="M16 1.8L10.5 4L4.2 5.9L4.4 15L4.9 17.2L5.8 19.4L7.5 22L9.6 24.6L12.4 27.2L16 29.9L19.6 27.2L22.4 24.6L24.5 22L26.2 19.4L27.1 17.2L27.6 15L27.8 5.9L21.5 4Z" fill="#170904"/><path d="M10.4 9.7L12.1 9.7L16 18.5L19.9 9.7L21.6 9.7L16.1 22L15.9 22Z" fill="#eeb841"/></svg>VoiceForever<i></i><span class="pl" style="color:'+P[s]+'">'+T(s)+'</span></div>';
h+='<div class="ln" style="color:'+(C[sel]||C.say)+(s=='cancel'?';text-decoration:line-through;opacity:.55':'')+'">['+e(label())+'] '+e(d.x)+'</div>';
if(d.o)h+='<div class="hn">'+T('you_said',{text:e(d.o)})+'</div>';
if(s=='ask'){
h+='<div class="g">'+['say','group','guild','raid','whisper','reply'].map(chip).join('')+'</div>';
if(sel=='whisper'){h+='<div class="lb">'+T('to')+'</div><div class="g">'+(d.n||[]).map(function(x,i){return'<button class="c'+(to==x?' on':'')+'" onclick="nick('+i+')">'+e(x)+'</button>'}).join('')+'</div><div class="hn">'+T('names_hint')+'</div>'}
h+=more?'<div class="g">'+['yell','instance','officer','emote'].map(chip).join('')+'</div>':'<button class="a" style="align-self:flex-start" onclick="more=1;draw()">'+T('more')+'</button>';
h+='<div class="r"><button class="b gh" onclick="go(\'x\')">'+T('cancel_button')+'</button><button class="b" style="flex:1.4"'+(sel=='whisper'&&!to?' disabled':'')+' onclick="go(\'s\')">'+T('send')+'</button></div>';
h+='<div class="hn sa">'+(err||T('fix_hint'))+'</div>'}
if(s=='busy')h+='<div class="n sa" style="border-color:rgba(242,173,66,.45)">'+T('sending')+'</div>';
if(s=='sent')h+='<div class="n" style="border-color:rgba(94,212,116,.45);color:#d2f4d8">'+T('sent_at',{time:hm(d.a)})+'</div><button class="a sa" style="align-self:flex-start" onclick="go(\'s\')">'+T('send_again')+'</button>';
if(s=='fail')h+='<div class="n" style="border-color:rgba(255,117,99,.55);color:#ffd8d0">✕ '+(d.e?e(d.e):T('failed'))+'</div><div class="r sa"><button class="b" onclick="go(\'s\')">'+T('retry')+'</button><button class="b gh" onclick="go(\'x\')">'+T('cancel_button')+'</button></div>';
if(s=='cancel')h+='<div class="hn sa">'+T('cancelled')+' <button class="a" onclick="go(\'u\')">'+T('undo')+'</button></div>';
R.innerHTML=h;fit()}
function go(a){
if(a=='s'&&sel=='whisper'&&!to)return;
var q=a+':'+d.i+(a=='s'?':'+sel+(to?':'+to:''):''),old=d.s;
d.s=a=='s'?'busy':a=='x'?'cancel':'ask';draw();
W.request(q).then(function(){},function(){d.s=old;err=T('request_failed');draw()})}
W.onEvent('chatDataChanged',load);load();if(W.ready)W.ready()
</script>
