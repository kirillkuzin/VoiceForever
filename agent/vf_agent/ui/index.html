<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoiceForever</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="win">
  <header class="bar pywebview-drag-region">
    <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 0L10.2 2.5L2.7 4.9L2.8 15.2L3.3 17.5L4.4 20.2L6.2 23.1L8.4 25.7L11.3 28.4L16 32L20.7 28.4L23.6 25.7L25.8 23.1L27.6 20.2L28.7 17.5L29.2 15.2L29.3 4.9L21.8 2.5Z" fill="#eeb841"/><path d="M16 1.8L10.5 4L4.2 5.9L4.4 15L4.9 17.2L5.8 19.4L7.5 22L9.6 24.6L12.4 27.2L16 29.9L19.6 27.2L22.4 24.6L24.5 22L26.2 19.4L27.1 17.2L27.6 15L27.8 5.9L21.5 4Z" fill="#170904"/><path d="M10.4 9.7L12.1 9.7L16 18.5L19.9 9.7L21.6 9.7L16.1 22L15.9 22Z" fill="#eeb841"/></svg>
    <span class="brand pywebview-drag-region">VoiceForever</span>
    <span class="spacer pywebview-drag-region"></span>
    <span class="ver pywebview-drag-region" id="version"></span>
    <span class="langpick" id="lang-box"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.9 8h12.2M8 1.7c-2.2 2.2-2.2 10.4 0 12.6M8 1.7c2.2 2.2 2.2 10.4 0 12.6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg><span id="lang-code"></span><select id="lang-pick" data-i18n-attr="aria-label:app.language;title:app.language"></select></span>
    <button class="wbtn" type="button" id="btn-minimize" data-i18n-attr="aria-label:app.minimize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="wbtn x" type="button" id="btn-close" data-i18n-attr="aria-label:app.close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </header>

  <!-- ============================================================ first run -->
  <main class="view" id="view-wizard" hidden>
    <div class="field">
      <h1 class="title" data-i18n="wizard.title"></h1>
    </div>
    <ol class="steps" data-i18n-attr="aria-label:wizard.steps">
      <li data-step="1"><span class="sn">1</span><span class="sl" data-i18n="section.server"></span></li>
      <li data-step="2"><span class="sn">2</span><span class="sl" data-i18n="wizard.step_mode"></span></li>
      <li data-step="3"><span class="sn">3</span><span class="sl" data-i18n="section.voice"></span></li>
      <li data-step="4"><span class="sn">4</span><span class="sl" data-i18n="wizard.step_check"></span></li>
    </ol>

    <section class="panel grow" data-page="1" data-i18n-attr="aria-label:section.server">
      <h2 class="ph" data-i18n="section.server"></h2>
      <div class="field">
        <div class="lrow"><label class="lbl" for="w-url" data-i18n="field.server_url"></label><button class="info" type="button" data-i18n-tip="tip.server_url"></button></div>
        <input class="inp" id="w-url" data-field="server_url" type="text" spellcheck="false" autocomplete="off" placeholder="wss://vf.example.com/ws">
        <span class="err" data-error-for="server_url"></span>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="w-token" data-i18n="field.token"></label><button class="info" type="button" data-i18n-tip="tip.token"></button></div>
        <div class="row">
          <input class="inp grow" id="w-token" data-field="token" type="password" spellcheck="false" autocomplete="off">
          <button class="btn ghost" type="button" data-reveal="w-token" style="min-width: 108px; min-height: 42px"></button>
        </div>
        <span class="err" data-error-for="token"></span>
      </div>
      <div class="err" data-error-for="file"></div>
      <div class="note" id="w-check" hidden></div>
    </section>

    <section class="panel grow" data-page="2" data-i18n-attr="aria-label:field.mode" hidden>
      <h2 class="ph"><span data-i18n="field.mode"></span><button class="info" type="button" data-i18n-tip="tip.mode"></button></h2>
      <div class="field" data-i18n-attr="aria-label:field.mode">
        <button class="choice" type="button" data-mode="addon">
          <span class="ct"><span class="dot"></span><span data-i18n="wizard.mode_addon"></span><span class="badge" data-i18n="wizard.recommended"></span></span>
        </button>
        <button class="choice" type="button" data-mode="chat">
          <span class="ct"><span class="dot"></span><span data-i18n="mode.chat"></span></span>
        </button>
      </div>
      <div class="field" data-addon-only>
        <div class="lrow"><span class="lbl" data-i18n="field.addon_hotkey"></span><button class="info" type="button" data-i18n-tip="tip.addon_hotkey"></button></div>
        <div class="keys"><span class="row" data-hotkey></span><span class="grow"></span><button class="btn ghost sm" type="button" data-capture data-i18n="common.change"></button></div>
        <span class="err" data-error-for="addon_hotkey"></span>
        <span class="hint warn" data-hotkey-hint></span>
      </div>
    </section>

    <section class="panel grow scrollp" data-page="3" data-i18n-attr="aria-label:section.voice" hidden>
      <h2 class="ph" data-i18n="section.voice"></h2>
      <div class="field">
        <div class="lrow"><label class="lbl" for="w-mic" data-i18n="field.mic"></label><button class="info" type="button" data-i18n-tip="tip.mic"></button></div>
        <div class="selwrap">
          <select class="inp sel-inp" id="w-mic" data-mic></select>
          <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="#dcb563" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="row">
          <div class="lvl" data-level role="meter" data-i18n-attr="aria-label:mic.level" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"></div>
          <button class="btn ghost sm" type="button" data-mic-test style="flex: none"></button>
        </div>
        <span class="hint bad" data-mic-hint></span>
      </div>
      <div class="field">
        <div class="lrow"><span class="lbl" data-i18n="field.ptt_button"></span><button class="info" type="button" data-ptt-tip></button></div>
        <div class="padcard" data-padcard>
          <svg width="44" height="32" viewBox="0 0 44 32" aria-hidden="true" style="flex: none"><path d="M12 5h20c5 0 8 4 9 9l2 9c.8 4-3.5 6.5-6.5 3.5L31 21H13l-5.5 5.5C4.5 29.5.2 27 1 23l2-9c1-5 4-9 9-9z" fill="#120d09" stroke="#dcb563" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 11v6M7 14h6" stroke="#7d6130" stroke-width="1.6" stroke-linecap="round"/><circle cx="33" cy="11.5" r="1.6" fill="#7d6130"/><circle cx="36" cy="14.5" r="1.6" fill="#7d6130"/><circle cx="29" cy="17.5" r="3.4" fill="#2b2118" stroke="#ffe1a0" stroke-width="1.6"/><circle cx="29" cy="17.5" r="6" fill="none" stroke="#ffd77a" stroke-width="1" opacity=".55"/></svg>
          <div class="field grow" style="gap: 2px" data-pad-info></div>
          <button class="btn ghost sm" type="button" data-pad-capture style="flex: none" data-i18n="pad.assign"></button>
        </div>
        <span class="err" data-error-for="ptt_button"></span>
      </div>
      <div class="field">
        <div class="lrow"><span class="lbl" id="w-pttmode-l" data-i18n="field.ptt_mode"></span><button class="info" type="button" data-i18n-tip="tip.ptt_mode"></button></div>
        <div class="seg" role="group" aria-labelledby="w-pttmode-l">
          <button class="segb" type="button" data-pttmode="toggle" data-i18n="ptt.toggle"></button>
          <button class="segb" type="button" data-pttmode="hold" data-i18n="ptt.hold"></button>
        </div>
      </div>
    </section>

    <section class="panel grow scrollp" data-page="4" data-i18n-attr="aria-label:bind.title" hidden>
      <h2 class="ph"><span data-i18n="bind.title"></span><button class="info" type="button" data-bind-tip></button></h2>
      <p class="hint" id="w-bind-intro"></p>
      <ol class="chks" data-bind-rows data-i18n-attr="aria-label:bind.progress"></ol>
      <div class="note" data-bind-result hidden></div>
      <div class="row" data-bind-actions></div>
      <div class="sep"></div>
      <div class="row" style="gap: 12px">
        <span class="grow" id="w-voice-say"></span>
        <span id="w-voice-rec"></span>
      </div>
      <div class="note" id="w-voice-result" hidden></div>
      <div class="sep"></div>
      <label class="sw" for="w-auto"><input id="w-auto" type="checkbox"><span class="track"></span><span data-i18n="settings.connect_on_start"></span></label>
      <label class="sw" for="w-boot"><input id="w-boot" type="checkbox"><span class="track"></span><span data-i18n="field.autostart"></span></label>
    </section>

    <div class="row">
      <button class="btn ghost" type="button" id="w-back" hidden data-i18n="common.back"></button>
      <span class="grow"></span>
      <button class="btn ghost" type="button" id="w-skip" hidden data-i18n="common.skip"></button>
      <button class="link" type="button" id="w-later" hidden style="align-self: center; margin-right: 8px" data-i18n="common.skip"></button>
      <button class="btn wide" type="button" id="w-next"></button>
    </div>
  </main>

  <!-- ============================================================ status -->
  <main class="view" id="view-status" hidden>
    <section class="panel" data-i18n-attr="aria-label:status.connection">
      <div class="row" style="gap: 18px">
        <span class="orb" id="st-orb" aria-hidden="true"></span>
        <div class="field grow" style="gap: 2px">
          <span class="state" id="st-title" role="status"></span>
          <span class="url" id="st-url"></span>
          <span class="hint nums" id="st-line"></span>
        </div>
      </div>
      <div class="row" id="st-account" hidden style="gap: 10px">
        <span class="pill" id="st-plan"></span>
        <span class="hint nums grow" id="st-quota"></span>
        <button class="info" type="button" data-i18n-tip="tip.account"></button>
        <button class="link" type="button" id="st-account-open" data-i18n="account.open"></button>
      </div>
      <div class="row wrap" id="st-actions"></div>
    </section>

    <section class="panel" data-i18n-attr="aria-label:status.game_voice" style="gap: 10px; padding: 12px 16px">
      <div class="row" style="gap: 14px">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><g transform="rotate(-45 16 16)"><path d="M16 .5l2 3.2V20h-4V3.7z" fill="#120d09" stroke="#dcb563" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 20.8h12M16 21.5v5" stroke="#dcb563" stroke-width="1.9" stroke-linecap="round"/><circle cx="16" cy="28.6" r="1.6" fill="#dcb563"/></g><g transform="rotate(45 16 16)"><path d="M16 .5l2 3.2V20h-4V3.7z" fill="#120d09" stroke="#dcb563" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 20.8h12M16 21.5v5" stroke="#dcb563" stroke-width="1.9" stroke-linecap="round"/><circle cx="16" cy="28.6" r="1.6" fill="#dcb563"/></g></svg>
        <div class="lrow grow" style="align-items: center"><span style="font-weight: 700">World of Warcraft</span><button class="info" type="button" data-i18n-tip="tip.game"></button></div>
        <span class="pill" id="game-pill"></span>
      </div>
      <div class="row" id="st-names" style="gap: 6px; padding-left: 44px" hidden>
        <span class="hint nums grow" id="st-names-line"></span>
        <button class="info" type="button" data-i18n-tip="tip.names"></button>
      </div>
      <div id="st-voice" hidden>
        <div class="divider"></div>
        <div class="row" style="gap: 12px; padding-top: 10px">
          <svg width="34" height="25" viewBox="0 0 44 32" aria-hidden="true" style="flex: none"><path d="M12 5h20c5 0 8 4 9 9l2 9c.8 4-3.5 6.5-6.5 3.5L31 21H13l-5.5 5.5C4.5 29.5.2 27 1 23l2-9c1-5 4-9 9-9z" fill="#120d09" stroke="#dcb563" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 11v6M7 14h6" stroke="#7d6130" stroke-width="1.6" stroke-linecap="round"/><circle cx="33" cy="11.5" r="1.6" fill="#7d6130"/><circle cx="36" cy="14.5" r="1.6" fill="#7d6130"/><circle cx="29" cy="17.5" r="3.4" fill="#2b2118" stroke="#ffe1a0" stroke-width="1.6"/><circle cx="29" cy="17.5" r="6" fill="none" stroke="#ffd77a" stroke-width="1" opacity=".55"/></svg>
          <div class="field grow" style="gap: 1px">
            <span style="font-weight: 700" id="st-pad-label"></span>
            <span class="hint" id="st-pad-hint"></span>
          </div>
          <span id="st-rec"></span>
        </div>
        <div class="lvl thin" id="st-level" aria-hidden="true" hidden></div>
      </div>
    </section>

    <section class="panel grow" data-i18n-attr="aria-label:msgs.title" style="min-height: 0; gap: 8px">
      <div class="row" style="gap: 12px">
        <h2 class="ph grow" data-i18n="msgs.title"></h2>
        <button class="link" type="button" id="btn-log" data-i18n="status.open_log"></button>
      </div>
      <ul class="msgs" id="msgs"></ul>
      <div class="row" style="gap: 12px; padding-top: 4px">
        <button class="btn ghost" type="button" id="st-test" style="flex: none" data-i18n="status.test"></button>
        <button class="info" type="button" data-i18n-tip="tip.test"></button>
        <span class="hint" id="st-test-hint"></span>
      </div>
    </section>
  </main>

  <!-- ============================================================ settings -->
  <main class="view scroll" id="view-settings" hidden>
    <div class="note bad" id="s-file-error" hidden></div>

    <section class="panel" data-i18n-attr="aria-label:section.server">
      <h2 class="ph" data-i18n="section.server"></h2>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-url" data-i18n="field.server_url"></label><button class="info" type="button" data-i18n-tip="tip.server_url"></button></div>
        <input class="inp" id="s-url" data-field="server_url" type="text" spellcheck="false" autocomplete="off" placeholder="wss://vf.example.com/ws">
        <span class="err" data-error-for="server_url"></span>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-token" data-i18n="field.token"></label><button class="info" type="button" data-i18n-tip="tip.token"></button></div>
        <div class="row">
          <input class="inp grow" id="s-token" data-field="token" type="password" spellcheck="false" autocomplete="off">
          <button class="btn ghost" type="button" data-reveal="s-token" style="min-width: 108px; min-height: 42px"></button>
        </div>
        <span class="err" data-error-for="token"></span>
      </div>
    </section>

    <section class="panel" data-i18n-attr="aria-label:section.input">
      <h2 class="ph" data-i18n="section.input"></h2>
      <div class="field">
        <div class="lrow"><span class="lbl" id="s-mode-l" data-i18n="field.mode"></span><button class="info" type="button" data-i18n-tip="tip.mode"></button></div>
        <div class="seg" role="group" aria-labelledby="s-mode-l">
          <button class="segb" type="button" data-mode="addon" data-i18n="settings.mode_addon"></button>
          <button class="segb" type="button" data-mode="chat" data-i18n="mode.chat"></button>
        </div>
        <span class="err" data-error-for="mode"></span>
      </div>
      <div class="field" data-addon-only>
        <div class="lrow"><span class="lbl" data-i18n="field.addon_hotkey"></span><button class="info" type="button" data-i18n-tip="tip.addon_hotkey"></button></div>
        <div class="keys"><span class="row" data-hotkey></span><span class="grow"></span><button class="btn ghost sm" type="button" data-capture data-i18n="common.change"></button></div>
        <span class="err" data-error-for="addon_hotkey"></span>
        <span class="hint warn" data-hotkey-hint></span>
      </div>
    </section>

    <section class="panel" data-i18n-attr="aria-label:section.voice">
      <h2 class="ph" data-i18n="section.voice"></h2>
      <label class="sw" for="s-ptt"><input id="s-ptt" data-check="ptt_enabled" type="checkbox"><span class="track"></span><span data-i18n="settings.ptt_enabled"></span></label>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-mic" data-i18n="field.mic"></label><button class="info" type="button" data-i18n-tip="tip.mic"></button></div>
        <div class="selwrap">
          <select class="inp sel-inp" id="s-mic" data-mic></select>
          <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="#dcb563" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="row">
          <div class="lvl" data-level role="meter" data-i18n-attr="aria-label:mic.level" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"></div>
          <button class="btn ghost sm" type="button" data-mic-test style="flex: none"></button>
        </div>
        <span class="hint bad" data-mic-hint></span>
      </div>
      <div class="field">
        <div class="lrow"><span class="lbl" data-i18n="field.ptt_button"></span><button class="info" type="button" data-ptt-tip></button></div>
        <div class="padcard" data-padcard>
          <svg width="44" height="32" viewBox="0 0 44 32" aria-hidden="true" style="flex: none"><path d="M12 5h20c5 0 8 4 9 9l2 9c.8 4-3.5 6.5-6.5 3.5L31 21H13l-5.5 5.5C4.5 29.5.2 27 1 23l2-9c1-5 4-9 9-9z" fill="#120d09" stroke="#dcb563" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 11v6M7 14h6" stroke="#7d6130" stroke-width="1.6" stroke-linecap="round"/><circle cx="33" cy="11.5" r="1.6" fill="#7d6130"/><circle cx="36" cy="14.5" r="1.6" fill="#7d6130"/><circle cx="29" cy="17.5" r="3.4" fill="#2b2118" stroke="#ffe1a0" stroke-width="1.6"/><circle cx="29" cy="17.5" r="6" fill="none" stroke="#ffd77a" stroke-width="1" opacity=".55"/></svg>
          <div class="field grow" style="gap: 2px" data-pad-info></div>
          <button class="btn ghost sm" type="button" data-pad-capture style="flex: none" data-i18n="pad.assign"></button>
        </div>
        <span class="err" data-error-for="ptt_button"></span>
        <div class="row" style="gap: 10px; align-items: baseline">
          <span class="hint grow" id="s-bind-line"></span>
          <button class="link" type="button" id="s-bind-open" style="flex: none" data-i18n="bind.open"></button>
          <button class="info" type="button" data-bind-tip style="align-self: center"></button>
        </div>
        <div class="field" id="s-bind-box" hidden>
          <ol class="chks" data-bind-rows data-i18n-attr="aria-label:bind.progress"></ol>
          <div class="note" data-bind-result hidden></div>
          <div class="row" data-bind-actions></div>
        </div>
      </div>
      <div class="field">
        <div class="lrow"><span class="lbl" id="s-pttmode-l" data-i18n="field.ptt_mode"></span><button class="info" type="button" data-i18n-tip="tip.ptt_mode"></button></div>
        <div class="seg" role="group" aria-labelledby="s-pttmode-l">
          <button class="segb" type="button" data-pttmode="toggle" data-i18n="ptt.toggle"></button>
          <button class="segb" type="button" data-pttmode="hold" data-i18n="ptt.hold"></button>
        </div>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-max" data-i18n="settings.max_record"></label><button class="info" type="button" data-i18n-tip="tip.max_record"></button></div>
        <div class="row" style="gap: 12px"><input id="s-max" data-range="max_record_s" data-unit="s" type="range" min="5" max="60" step="5"><output class="val" for="s-max"></output></div>
        <span class="err" data-error-for="max_record_s"></span>
      </div>
      <label class="sw" for="s-snd"><input id="s-snd" data-check="ptt_sounds" type="checkbox"><span class="track"></span><span data-i18n="settings.ptt_sounds"></span><button class="info" type="button" data-i18n-tip="tip.ptt_sounds"></button></label>
    </section>

    <section class="panel" data-i18n-attr="aria-label:settings.names">
      <h2 class="ph" data-i18n="settings.names"></h2>
      <label class="sw" for="s-names"><input id="s-names" data-check="game_context" type="checkbox"><span class="track"></span><span data-i18n="settings.game_context"></span><button class="info" type="button" data-i18n-tip="tip.game_context"></button></label>
      <label class="sw" for="s-live"><input id="s-live" data-check="live_context" type="checkbox"><span class="track"></span><span data-i18n="settings.live_context"></span><button class="info" type="button" data-i18n-tip="tip.live_context"></button></label>
    </section>

    <section class="panel" data-i18n-attr="aria-label:settings.game_window">
      <h2 class="ph"><span data-i18n="settings.game_window"></span><button class="info" type="button" data-i18n-tip="tip.game_window"></button></h2>
      <div class="field">
        <div class="lrow"><span class="lbl" data-i18n="settings.window_titles"></span></div>
        <div class="chips" data-chips="window_titles"></div>
        <span class="err" data-error-for="window_titles"></span>
      </div>
      <div class="field">
        <div class="lrow"><span class="lbl" data-i18n="settings.process_names"></span></div>
        <div class="chips" data-chips="process_names"></div>
        <span class="err" data-error-for="process_names"></span>
      </div>
      <div class="field" style="gap: 8px">
        <div class="row"><button class="btn ghost" type="button" id="s-detect" data-i18n="detect.button"></button><button class="info" type="button" data-i18n-tip="tip.detect"></button></div>
        <div class="note" id="s-detect-note" hidden></div>
      </div>
    </section>

    <section class="panel" data-i18n-attr="aria-label:settings.timings">
      <h2 class="ph" data-i18n="settings.timings"></h2>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-focus" data-i18n="settings.focus_wait"></label><button class="info" type="button" data-i18n-tip="tip.focus_wait"></button></div>
        <div class="row" style="gap: 12px"><input id="s-focus" data-range="focus_wait_s" data-unit="s" type="range" min="1" max="60" step="1"><output class="val" for="s-focus"></output></div>
        <span class="err" data-error-for="focus_wait_s"></span>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-open" data-i18n="settings.open_delay"></label><button class="info" type="button" data-i18n-tip="tip.open_delay"></button></div>
        <div class="row" style="gap: 12px"><input id="s-open" data-range="open_delay_ms" data-unit="ms" type="range" min="0" max="500" step="10"><output class="val" for="s-open"></output></div>
        <span class="err" data-error-for="open_delay_ms"></span>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-part" data-i18n="settings.part_delay"></label><button class="info" type="button" data-i18n-tip="tip.part_delay"></button></div>
        <div class="row" style="gap: 12px"><input id="s-part" data-range="part_delay_ms" data-unit="ms" type="range" min="100" max="2000" step="50"><output class="val" for="s-part"></output></div>
        <span class="err" data-error-for="part_delay_ms"></span>
      </div>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-key" data-i18n="settings.key_delay"></label><button class="info" type="button" data-i18n-tip="tip.key_delay"></button></div>
        <div class="row" style="gap: 12px"><input id="s-key" data-range="key_delay_ms" data-unit="ms" type="range" min="0" max="100" step="5"><output class="val" for="s-key"></output></div>
        <span class="err" data-error-for="key_delay_ms"></span>
      </div>
      <button class="link" type="button" id="s-reset-timings" data-i18n="settings.reset_timings"></button>
    </section>

    <section class="panel" data-i18n-attr="aria-label:settings.app">
      <h2 class="ph" data-i18n="settings.app"></h2>
      <label class="sw" for="s-auto"><input id="s-auto" data-check="connect_on_start" type="checkbox"><span class="track"></span><span data-i18n="settings.connect_on_start"></span></label>
      <label class="sw" for="s-tray"><input id="s-tray" data-check="close_to_tray" type="checkbox"><span class="track"></span><span data-i18n="settings.close_to_tray"></span></label>
      <label class="sw" for="s-boot"><input id="s-boot" data-check="autostart" type="checkbox"><span class="track"></span><span data-i18n="field.autostart"></span></label>
      <div class="field">
        <div class="lrow"><label class="lbl" for="s-lang" data-i18n="settings.language"></label><button class="info" type="button" data-i18n-tip="tip.language"></button></div>
        <div class="selwrap">
          <select class="inp sel-inp" id="s-lang"></select>
          <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1l5 5 5-5" fill="none" stroke="#dcb563" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
      </div>
      <div class="field" style="padding-top: 4px">
        <span class="lbl" data-i18n="settings.config_file"></span>
        <div class="row"><code class="path" id="s-path"></code><button class="btn ghost sm" type="button" id="s-open-folder" data-i18n="settings.open_folder"></button></div>
      </div>
    </section>

    <div class="savebar">
      <span class="hint grow" id="s-dirty" role="status"></span>
      <button class="btn ghost" type="button" id="s-cancel" data-i18n="common.cancel"></button>
      <button class="btn" type="button" id="s-save" data-i18n="common.save"></button>
    </div>
  </main>

  <nav class="tabs" id="tabs" data-i18n-attr="aria-label:tabs.label" hidden>
    <button class="tab" type="button" data-tab="status" data-i18n="tabs.status"></button>
    <button class="tab" type="button" data-tab="settings" data-i18n="tabs.settings"></button>
  </nav>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
