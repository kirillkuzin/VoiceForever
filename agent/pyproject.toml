[project]
name = "voiceforever-agent"
version = "0.2.0"
description = "Types VoiceForever messages into the World of Warcraft chat (Windows 10/11)"
requires-python = ">=3.15"
license = "MIT"
dependencies = ["websockets>=17.4"]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "aiohttp>=3.14.5", "pyinstaller>=6.22.3"]

[project.scripts]
voiceforever-agent = "vf_agent.__main__:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vf_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../server"]
