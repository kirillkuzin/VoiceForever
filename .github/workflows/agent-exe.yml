name: Agent exe

# Tests the agent and builds VoiceForeverAgent.exe on Windows.
# Pull requests and master: the exe is an artifact of the run (for testing).
# Tags v* (pushed, or created by publishing a release on GitHub): the release gets
# the exe, the addon zip and SHA256 checksums.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "agent/**"
      - "addon/**"
      - ".github/workflows/agent-exe.yml"
  pull_request:
    paths:
      - "agent/**"
      - "server/vf_server/hub.py"
      - "server/vf_server/chat.py"
      - ".github/workflows/agent-exe.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: uv run --locked pytest -q
      - name: Build exe
        run: uv run --locked pyinstaller --onefile --console --name VoiceForeverAgent run_agent.py
      - name: Smoke test the exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = ".\dist\VoiceForeverAgent.exe"
          $cfg = Join-Path $env:RUNNER_TEMP "vf-config.toml"
          # 1. No config yet: the exe writes a template and exits with 1.
          "" | & $exe --config $cfg
          if ($LASTEXITCODE -ne 1 -or -not (Test-Path $cfg)) { throw "template was not created" }
          # 2. Valid config, --test: loads the Windows input backend and, since WoW is
          #    not in front, gives up after focus_wait_s without typing anything.
          @"
          server_url = "ws://127.0.0.1:9/ws"
          token = "smoke-test-token-0123456789"
          focus_wait_s = 1
          "@ | Set-Content -Encoding utf8 $cfg
          $out = "" | & $exe --config $cfg --test | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "not_focused") { throw "unexpected --test result" }
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceForeverAgent
          path: agent/dist/VoiceForeverAgent.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: VoiceForeverAgent
          path: release
      - name: Package the addon
        run: (cd addon && zip -r "../release/VoiceForever-addon-${GITHUB_REF_NAME}.zip" VoiceForever)
      - name: Checksums
        run: (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "VoiceForever $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
