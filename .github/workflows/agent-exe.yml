name: Agent exe

# Tests the agent and the addon, and builds VoiceForeverAgent.exe on Windows with SDL3.dll
# (gamepad and microphone for push-to-talk) inside.
# Pull requests and master: the exe is an artifact of the run (for testing).
# Tags v* (pushed, or created by publishing a release on GitHub): the release gets
# the exe, the addon zip and SHA256 checksums.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "agent/**"
      - "addon/**"
      - ".github/workflows/agent-exe.yml"
  pull_request:
    paths:
      - "agent/**"
      - "addon/**"
      - "server/vf_server/hub.py"
      - "server/vf_server/chat.py"
      - ".github/workflows/agent-exe.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # SDL3 from libsdl-org/SDL releases. A new version needs a new hash: the step prints it.
  SDL_VERSION: "3.4.8"
  SDL_SHA256: "bba56c4fd0b2582928605614c620d217a2f1f98eb118df8b1c768af4b7159572"

concurrency:
  group: agent-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Get SDL3.dll
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "SDL3.zip"
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-$env:SDL_VERSION-win32-x64.zip"
          Invoke-WebRequest $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Output "SDL3-$env:SDL_VERSION-win32-x64.zip sha256 $hash"
          if ($hash -ne $env:SDL_SHA256) { throw "SDL3 zip hash mismatch" }
          $dir = Join-Path $env:RUNNER_TEMP "sdl"
          Expand-Archive $zip -DestinationPath $dir -Force
          Copy-Item (Join-Path $dir "SDL3.dll") SDL3.dll
      - name: Run tests
        # test_devices.py drives the real SDL3.dll: a virtual gamepad and the dummy microphone.
        run: uv run --locked pytest -q
      - name: Build exe
        run: |
          uv run --locked python -m vf_agent.gui.icons build\VoiceForever.ico
          uv run --locked pyinstaller --noconfirm --onefile --windowed --name VoiceForeverAgent `
            --icon build\VoiceForever.ico --add-data "vf_agent\ui;vf_agent\ui" --add-binary "SDL3.dll;." run_agent.py
      - name: Smoke test the exe
        run: |
          # The exe is a window app: Start-Process waits for it, and the checks read agent.log,
          # which the agent writes next to its config.toml.
          $exe = (Resolve-Path .\dist\VoiceForeverAgent.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP "vf"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $cfg = Join-Path $dir "config.toml"
          $log = Join-Path $dir "agent.log"
          function Invoke-Agent([string]$arguments, [int]$seconds = 60) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            $null = $p.Handle  # keeps ExitCode available after the process ends
            if (-not $p.WaitForExit($seconds * 1000)) { taskkill /PID $p.Id /T /F | Out-Null; throw "timed out: $arguments" }
            return $p.ExitCode
          }
          # 1. No config yet, no window: the exe writes a template and exits with 1.
          $code = Invoke-Agent "--headless --config `"$cfg`""
          if ($code -ne 1 -or -not (Test-Path $cfg)) { throw "template was not created (exit $code)" }
          # 2. Valid config, --test: loads the Windows input backend and, since WoW is
          #    not in front, gives up after focus_wait_s without typing anything.
          @"
          server_url = "ws://127.0.0.1:9/ws"
          token = "smoke-test-token-0123456789"
          focus_wait_s = 1
          "@ | Set-Content -Encoding utf8 $cfg
          $code = Invoke-Agent "--test --config `"$cfg`""
          Get-Content $log
          if ($code -ne 0 -or -not (Select-String -Path $log -Pattern "not_focused" -Quiet)) { throw "unexpected --test result (exit $code)" }
          # 3. The window: WebView2 loads the page and the page reads the agent state.
          $p = Start-Process -FilePath $exe -ArgumentList "--config `"$cfg`"" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            Start-Sleep -Seconds 1
            $ready = Select-String -Path $log -Pattern "window is ready" -Quiet
            if ($p.HasExited) { break }
          }
          taskkill /PID $p.Id /T /F | Out-Null
          Get-Content $log -Tail 30
          if (-not $ready) { throw "the agent window did not load" }
          # 4. SDL3.dll is inside the exe. A runner may have no sound card, so only a missing
          #    library fails the build.
          if (Select-String -Path $log -Pattern "SDL3 не найден" -Quiet) { throw "SDL3.dll is not in the exe" }
          if (-not (Select-String -Path $log -Pattern "SDL 3\." -Quiet)) { Write-Warning "SDL3 did not start on the runner" }
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceForeverAgent
          path: agent/dist/VoiceForeverAgent.exe
          if-no-files-found: error

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run the addon in Lua 5.1 (lupa) against stubs of the game API
        working-directory: addon
        run: uv run --no-project --python 3.13 --with pytest --with lupa pytest -q tests

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, addon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: VoiceForeverAgent
          path: release
      - name: Package the addon
        run: (cd addon && zip -r "../release/VoiceForever-addon-${GITHUB_REF_NAME}.zip" VoiceForever)
      - name: Checksums
        run: (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "VoiceForever $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
